[package]
name = "metro_api"
version = "0.1.0"
edition = "2024"
description = "Read-only public portfolio API for Mexico City Metro and Metrobús"
license = "MIT"

[dependencies]
# Axum: framework HTTP asíncrono (rutas, extractores, JSON).
axum = "0.8"
# Serde: serializa structs a JSON de respuesta y deserializa data/*.json.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tokio: runtime async sobre el que corre Axum.
tokio = { version = "1", features = ["full"] }
# CORS abierto: esta API es pública de portafolio.
tower-http = { version = "0.6", features = ["cors"] }
